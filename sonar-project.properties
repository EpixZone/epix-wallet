# SonarCloud configuration for epix-wallet.
# Set up: import the repo at https://sonarcloud.io, then add SONAR_TOKEN as a
# GitHub Actions secret. Replace the org/key below with your SonarCloud values.
sonar.organization=epixzone
sonar.projectKey=EpixZone_epix-wallet

sonar.sources=packages,apps
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,.yarn/**
sonar.tests=packages,apps
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts
sonar.typescript.tsconfigPath=tsconfig.json

# Reviewed false positives / accepted findings.
# NOTE: these take effect only for CI-based analysis (this workflow). If the
# project still uses SonarCloud "Automatic Analysis", disable it in
# Administration > Analysis Method so this config governs the scan.
sonar.issue.ignore.multicriteria=e1,e2,e3

# e1: locale JSON strings like "password"/"Enter password" are UI labels, not
# hard-coded credentials (json:S2068).
sonar.issue.ignore.multicriteria.e1.ruleKey=json:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=**/languages/*.json

# e2/e3: design-system token-sync scripts are dev-only tooling run by hand; the
# /tmp paths and CLI args are not attacker-reachable in production.
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S5443
sonar.issue.ignore.multicriteria.e2.resourceKey=packages/design-system/scripts/**
sonar.issue.ignore.multicriteria.e3.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.e3.resourceKey=packages/design-system/scripts/**
