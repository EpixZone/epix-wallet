name: Lint
on:
  pull_request:
  push:

jobs:
  lint:
    name: Lint code base
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v3
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: "22.22.1"
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn ci-lint
