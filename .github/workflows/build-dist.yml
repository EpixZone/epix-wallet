name: Build wallet dist

# Builds the Firefox extension and publishes it as an immutable per-commit
# "wallet-<rev>" release (rev = the 12-char commit SHA). EpixNet pins a specific
# rev in shells/wallet-ext.rev; its epix-browser build.rs and Android build
# download that exact release, so an EpixNet build is reproducible and adopting
# a new wallet is a deliberate pin bump. The semver in package.json tracks
# upstream Keplr and is not unique per fork build, so the commit is the pin.

on:
  push:
    branches:
      - epix
  workflow_dispatch:

concurrency:
  group: build-dist
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable yarn 3
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build libraries
        run: yarn build:libs

      - name: Build extension
        run: yarn workspace @keplr-wallet/extension build

      - name: Zip firefox build
        run: |
          cd apps/extension/build/firefox
          zip -qr "$GITHUB_WORKSPACE/epix-wallet-firefox.zip" .

      - name: Publish immutable per-commit release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REV="${GITHUB_SHA:0:12}"
          TAG="wallet-$REV"
          VERSION=$(node -p "require('./apps/extension/package.json').version")
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already published; wallet builds are immutable per commit."
          else
            gh release create "$TAG" \
              --title "Epix Wallet $VERSION ($REV)" \
              --notes "Immutable Firefox extension build for epix-wallet commit $GITHUB_SHA.
          Pin it in EpixNet: set shells/wallet-ext.rev to $REV." \
              --prerelease
            gh release upload "$TAG" epix-wallet-firefox.zip
          fi
