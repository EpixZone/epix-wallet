name: Build Design System Storybook

on:
  pull_request:
    branches: [epix]
    types: [opened, synchronize, reopened]
    paths:
      - "packages/design-system/**"
      - ".github/workflows/deploy-storybook.yml"
      - "package.json"
      - "yarn.lock"
  push:
    branches: [epix]
    paths:
      - "packages/design-system/**"
      - ".github/workflows/deploy-storybook.yml"
      - "package.json"
      - "yarn.lock"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: "storybook-build-${{ github.ref }}"
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - run: corepack enable
      - run: yarn install --immutable

      - name: Build Storybook
        run: yarn workspace @keplr-wallet/design-system build-storybook

      - name: Prepare Storybook artifact
        run: |
          mkdir -p artifacts/storybook
          cp -r packages/design-system/storybook-static/. artifacts/storybook/

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: design-system-storybook
          path: artifacts
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/epix')
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: artifacts

  deploy:
    name: Publish Storybook
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/epix')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}storybook/
    concurrency:
      group: storybook-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
