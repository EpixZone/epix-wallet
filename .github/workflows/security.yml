name: Security scan

on:
  push:
    branches: [epix]
  pull_request:
    branches: [epix]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# No workflow-level permissions; each job requests only what it needs.
permissions: {}

jobs:
  osv-scanner:
    name: osv-scanner (yarn.lock CVEs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install osv-scanner
        run: |
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v2.0.2/osv-scanner_linux_amd64" -o /tmp/osv-scanner
          sudo install /tmp/osv-scanner /usr/local/bin/osv-scanner
      # Report-only: the wallet has a known transitive-CVE backlog, so this
      # surfaces findings in the log without blocking. Tighten (drop the
      # "|| true") once the backlog is reduced.
      - name: Scan (report-only)
        run: osv-scanner scan source --lockfile=yarn.lock || true

  semgrep:
    name: semgrep (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: semgrep scan --config p/typescript --config p/javascript --config p/react --config p/security-audit --config p/secrets --config p/owasp-top-ten --sarif --output semgrep.sarif packages apps || true
      - uses: github/codeql-action/upload-sarif@df409f7d9260372bd5f19e5b04e83cb3c43714ae # v3.27.9
        if: always()
        with:
          sarif_file: semgrep.sarif

  trivy:
    name: trivy (deps + secrets + misconfig)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          skip-dirs: node_modules,.yarn
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
      - uses: github/codeql-action/upload-sarif@df409f7d9260372bd5f19e5b04e83cb3c43714ae # v3.27.9
        if: always()
        with:
          sarif_file: trivy.sarif

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # Run the gitleaks binary directly. The gitleaks-action requires a paid
      # license for GitHub organizations; the CLI itself is free (MIT).
      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
      # Report-only: surfaces any findings in the log (trufflehog's verified
      # scan found 0 real secrets). Drop the "|| true" to make it blocking.
      - name: Scan working tree (report-only)
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose || true
